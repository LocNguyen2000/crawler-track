<div style="margin:0;padding:32px 16px;background-color:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#172033;">
  <div style="max-width:640px;margin:0 auto;background-color:#ffffff;border:1px solid #dbe3ee;border-radius:12px;overflow:hidden;">
    <div style="padding:24px 32px;background-color:#102a43;color:#ffffff;">
      <p style="margin:0 0 8px;font-size:12px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:#9fbad0;">
        Spider-Man Crawler
      </p>
      <h1 style="margin:0;font-size:24px;line-height:1.3;">New data discovered</h1>
    </div>

    <div style="padding:28px 32px;">
      <p style="margin:0 0 18px;font-size:16px;line-height:1.6;">
        Your scheduled crawler <strong style="color:#102a43;">{{crawler_name}}</strong>
        found new data.
      </p>

      <table role="presentation" style="width:100%;margin:0 0 24px;border-collapse:collapse;">
        <tr>
          <td style="padding:14px 16px;background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;">
            <div style="font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">New rows</div>
            <div style="margin-top:4px;font-size:28px;font-weight:bold;color:#0f766e;">{{new_data_count}}</div>
          </td>
          <td style="width:12px;"></td>
          <td style="padding:14px 16px;background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;">
            <div style="font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">Crawler code</div>
            <div style="margin-top:8px;font-size:16px;font-weight:bold;color:#102a43;">{{crawler_code}}</div>
          </td>
        </tr>
      </table>

      <h2 style="margin:0 0 10px;font-size:16px;color:#102a43;">New data</h2>
      <pre style="margin:0;padding:16px;background-color:#0f172a;border-radius:8px;color:#e2e8f0;font-family:Consolas,'Courier New',monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;">{{new_data_json}}</pre>
    </div>

    <div style="padding:18px 32px;border-top:1px solid #e2e8f0;background-color:#f8fafc;">
      <p style="margin:0;font-size:12px;line-height:1.5;color:#64748b;">
        Automated notification from {{app_name}}.
      </p>
    </div>
  </div>
</div>
